<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Cem Sivas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Outfit:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #0b0d0c; --surface: #131714; --card: #181d1b;
      --border: rgba(255,255,255,0.06); --border-md: rgba(255,255,255,0.10);
      --ember: #e07540; --ember-dim: rgba(224,117,64,0.12); --ember-mid: rgba(224,117,64,0.30);
      --teal: #3a9178; --text: #d8d2cb; --text-muted: #6c7a75; --text-dim: #3a4642;
      --radius-md: 12px; --radius-lg: 18px;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 0.5rem 1rem;
      margin-bottom: 3rem;
      transition: color 0.2s, border-color 0.2s;
    }

    .back-btn:hover { color: var(--text); border-color: var(--border-md); }

    .page-header { margin-bottom: 2rem; }

    .page-header h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 5vw, 2.8rem);
      letter-spacing: -0.03em;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .page-header p { font-size: 0.95rem; color: var(--text-muted); font-weight: 300; }

    .contact-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.1rem 1.3rem;
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s, background 0.2s;
    }

    .contact-item:hover { border-color: var(--border-md); background: #1d2220; }

    .ci-icon {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--ember-dim);
      border: 1px solid var(--ember-mid);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .ci-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 0.1rem;
    }

    .ci-value {
      font-size: 0.93rem;
      color: var(--text);
      font-weight: 500;
    }

    .ci-value.accent { color: var(--ember); }

    .copy-note {
      font-size: 0.78rem;
      color: var(--text-dim);
      text-align: center;
      font-style: italic;
      margin-top: 1.5rem;
    }

    @media (max-width: 480px) {
      .container { padding: 2rem 1rem 3rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="../index.html" class="back-btn">← Back to Portfolio</a>

    <div class="page-header">
      <h1>Contact</h1>
      <p>Best ways to reach me — pick whichever works for you.</p>
    </div>

    <div class="contact-list">

      <a href="mailto:hayricemsivas@gmail.com" class="contact-item" id="email-item">
        <div class="ci-icon">✉️</div>
        <div>
          <div class="ci-label">Email</div>
          <div class="ci-value accent">hayricemsivas@gmail.com</div>
        </div>
      </a>

      <a href="https://github.com/cemsvs" target="_blank" class="contact-item">
        <div class="ci-icon">💻</div>
        <div>
          <div class="ci-label">GitHub</div>
          <div class="ci-value">cemsvs</div>
        </div>
      </a>

      <a href="https://www.youtube.com/@CemOver" target="_blank" class="contact-item">
        <div class="ci-icon">▶️</div>
        <div>
          <div class="ci-label">YouTube</div>
          <div class="ci-value">@CemOver</div>
        </div>
      </a>

      <a href="https://cemgo.itch.io/veinlight" target="_blank" class="contact-item">
        <div class="ci-icon">🎮</div>
        <div>
          <div class="ci-label">itch.io — VeinLight</div>
          <div class="ci-value">cemgo.itch.io/veinlight</div>
        </div>
      </a>

      <div class="contact-item" style="cursor: default;">
        <div class="ci-icon">📍</div>
        <div>
          <div class="ci-label">Location</div>
          <div class="ci-value">Samsun, Turkey</div>
        </div>
      </div>

    </div>

    <p class="copy-note" id="copy-note">Click the email address to copy it to clipboard</p>
  </div>

  <script>
    document.getElementById('email-item').addEventListener('click', function (e) {
      e.preventDefault();
      navigator.clipboard.writeText('hayricemsivas@gmail.com').then(function () {
        var note = document.getElementById('copy-note');
        note.textContent = '✓ Copied to clipboard!';
        note.style.color = '#3a9178';
        setTimeout(function () {
          note.textContent = 'Click the email address to copy it to clipboard';
          note.style.color = '';
        }, 2500);
      }).catch(function () {
        window.location.href = 'mailto:hayricemsivas@gmail.com';
      });
    });
  </script>
</body>
</html>
